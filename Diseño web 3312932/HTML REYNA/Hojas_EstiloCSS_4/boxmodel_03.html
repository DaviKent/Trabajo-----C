<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/boxmodel_03.css">
    <title>Document</title>
</head>
<body>
    <h1>Perfil de usuario</h1>
    <div class="perfil">
        <!--Portada con foto superpuesta-->
        <div class="portada">
            <div class="avatar">
                👩‍💻
            </div>
        </div>

        <!--Informacion del usuario-->
        <div class="perfil-info">
            <h2 class="perfil-nombre">Valeria Alejandra</h2>
            <p class="perfil-cargo">Aprendiz ADSO -- SENA CTPI</p>
            <p class="perfil-bio">Aprendiendo desarrollo web con HTML5 y CSS3 jornada de la mañana grupo 2026.</p>
        </div>

        <!-- Estadistica -->
         <div class="perfil-estadistica">
            <div class="estadistica">
                <span class="estadistica-num">12</span>
                <span class="estadistica-descripcion">Cursos</span>
            </div>
        
            <div class="estadistica">
                <span class="estadistica-num">8</span>
                <span class="estadistica-descripcion">Certificados</span>
            </div>
        
            <div class="estadistica">
                <span class="estadistica-num">90%</span>
                <span class="estadistica-descripcion">Completado</span>
            </div>
        </div>
    </div>
</body>
</html>
